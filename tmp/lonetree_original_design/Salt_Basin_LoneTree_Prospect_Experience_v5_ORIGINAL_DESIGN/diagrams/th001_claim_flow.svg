<text x="70" y="70" text-anchor="start" fill="#345A68" font-family="DejaVu Serif" font-size="40" font-weight="700" style="">TH-001 Pricing Transformation: One Claim, Three Rods</text><text x="70" y="105" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="20" font-weight="400" style="">A spreadsheet row becomes governed atoms, events, reconciliations and an attributable claim</text><rect x="45" y="170" width="235" height="105" rx="15" fill="#FFFFFF" stroke="#C4843A" stroke-width="3"/><text x="65" y="205" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">SOURCE ROW</text><text x="162" y="238" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="162" dy="0">Thesis • customer •</tspan><tspan x="162" dy="16.52">dates • investment •</tspan><tspan x="162" dy="16.52">impact</tspan></text><line x1="282" y1="222" x2="309" y2="222" stroke="#345A68" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="170" width="235" height="105" rx="15" fill="#FFFFFF" stroke="#4A7C8E" stroke-width="3"/><text x="335" y="205" text-anchor="start" fill="#4A7C8E" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">NORMALIZE</text><text x="432" y="238" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="432" dy="0">Identity • contract •</tspan><tspan x="432" dy="16.52">price version • signed</tspan><tspan x="432" dy="16.52">evidence</tspan></text><line x1="552" y1="222" x2="579" y2="222" stroke="#345A68" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="170" width="235" height="105" rx="15" fill="#FFFFFF" stroke="#D98CA0" stroke-width="3"/><text x="605" y="205" text-anchor="start" fill="#D98CA0" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">THREE RODS</text><text x="702" y="238" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="702" dy="0">Revenue • customer •</tspan><tspan x="702" dy="16.52">member journeys</tspan></text><line x1="822" y1="222" x2="849" y2="222" stroke="#345A68" stroke-width="3" marker-end="url(#arrow)"/><rect x="855" y="170" width="235" height="105" rx="15" fill="#FFFFFF" stroke="#345A68" stroke-width="3"/><text x="875" y="205" text-anchor="start" fill="#345A68" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">RECONCILE</text><text x="972" y="238" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="972" dy="0">Revenue↔GL • invoice↔AR</tspan><tspan x="972" dy="16.52">• cash↔bank</tspan></text><line x1="1092" y1="222" x2="1119" y2="222" stroke="#345A68" stroke-width="3" marker-end="url(#arrow)"/><rect x="1125" y="170" width="235" height="105" rx="15" fill="#FFFFFF" stroke="#C4843A" stroke-width="3"/><text x="1145" y="205" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">CLAIM OBJECT</text><text x="1242" y="238" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="1242" dy="0">Impact • confidence •</tspan><tspan x="1242" dy="16.52">evidence package</tspan></text><rect x="110" y="340" width="1180" height="50" rx="22" fill="#345A68" stroke="#345A68" stroke-width="0"/><text x="135" y="371" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Revenue lifecycle</text><text x="450" y="371" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">Lead → quote → contract → bill → cash → recognize</text><rect x="110" y="412" width="1180" height="50" rx="22" fill="#4A7C8E" stroke="#4A7C8E" stroke-width="0"/><text x="135" y="443" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Customer journey</text><text x="450" y="443" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">Prospect → qualify → onboard → active → renew</text><rect x="110" y="484" width="1180" height="50" rx="22" fill="#D98CA0" stroke="#D98CA0" stroke-width="0"/><text x="135" y="515" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Member journey</text><text x="450" y="515" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">Organization → role → access → activity → change</text><rect x="110" y="595" width="1180" height="70" rx="14" fill="#F1EBDD" stroke="#C4843A" stroke-width="2"/><text x="140" y="625" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="15" font-weight="700" style="">OUTPUT</text><text x="250" y="625" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="18" font-weight="700" style="">A time-stamped, source-linked evidence chain that can be replayed and challenged.</text><text x="250" y="651" text-anchor="start" fill="#345A68" font-family="DejaVu Sans" font-size="14" font-weight="600" style="">All example impacts, confidence scores and valuation effects remain illustrative until measured in production.</text><text x="60" y="732" fill="#345A68" font-family="DejaVu Sans" font-size="13" font-weight="600">© 2026 Martha Elizabeth Salter. All Rights Reserved. • Confidential &amp; Proprietary</text><text x="1340" y="732" text-anchor="end" fill="#345A68" font-family="DejaVu Sans" font-size="13" font-weight="700">SALT BASIN • GOVERNED REFERENCE</text></svg>