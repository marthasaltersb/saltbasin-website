chor="middle" fill="#345A68" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Execute</text><text x="586" y="230" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="586" dy="0">Changes captured</tspan></text><line x1="683" y1="218" x2="704" y2="218" stroke="#C4843A" stroke-width="3" marker-end="url(#arrow)"/><rect x="709" y="160" width="190" height="115" rx="15" fill="#FFFFFF" stroke="#C4843A" stroke-width="2"/><text x="729" y="193" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="17" font-weight="700" style="">4</text><text x="804" y="193" text-anchor="middle" fill="#345A68" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Realize</text><text x="804" y="230" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="804" dy="0">Impact classified</tspan></text><line x1="901" y1="218" x2="922" y2="218" stroke="#C4843A" stroke-width="3" marker-end="url(#arrow)"/><rect x="927" y="160" width="190" height="115" rx="15" fill="#F1EBDD" stroke="#C4843A" stroke-width="2"/><text x="947" y="193" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="17" font-weight="700" style="">5</text><text x="1022" y="193" text-anchor="middle" fill="#345A68" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Sustain</text><text x="1022" y="230" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="1022" dy="0">Evidence</tspan><tspan x="1022" dy="16.52">accumulates</tspan></text><line x1="1119" y1="218" x2="1140" y2="218" stroke="#C4843A" stroke-width="3" marker-end="url(#arrow)"/><rect x="1145" y="160" width="190" height="115" rx="15" fill="#FFFFFF" stroke="#C4843A" stroke-width="2"/><text x="1165" y="193" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="17" font-weight="700" style="">6</text><text x="1240" y="193" text-anchor="middle" fill="#345A68" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">Exit / prove</text><text x="1240" y="230" text-anchor="middle" fill="#2B2A28" font-family="DejaVu Sans" font-size="14" font-weight="600"><tspan x="1240" dy="0">Defense packaged</tspan></text><rect x="55" y="340" width="295" height="220" rx="15" fill="#FFFFFF" stroke="#C4843A" stroke-width="2"/><text x="75" y="375" text-anchor="start" fill="#C4843A" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">CLAIM OBJECT</text><text x="80" y="415" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Thesis statement</text><text x="80" y="447" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Owner + time horizon</text><text x="80" y="479" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Target metric</text><text x="80" y="511" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Success criteria</text><rect x="380" y="340" width="295" height="220" rx="15" fill="#FFFFFF" stroke="#4A7C8E" stroke-width="2"/><text x="400" y="375" text-anchor="start" fill="#4A7C8E" font-family="DejaVu Sans" font-size="16" font-weight="700" style="">ATTRIBUTION OBJECT</text><text x="405" y="415" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Candidate driver</text><text x="405" y="447" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Eligible movement</text><text x="405" y="479" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Competing drivers</text><text x="405" y="511" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="15" font-weight="600" style="">• Baseline + confidence</text><rect x="