ans" font-size="18" font-weight="700" style="">Forward method</text><text x="220" y="540" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="22" font-weight="700" style="">Prioritize  →  Underwrite  →  Measure  →  Attribute  →  Prove</text><text x="70" y="590" text-anchor="start" fill="#D98CA0" font-family="DejaVu Sans" font-size="18" font-weight="700" style="">Reverse friction test</text><text x="275" y="590" text-anchor="start" fill="#2B2A28" font-family="DejaVu Sans" font-size="18" font-weight="600" style="">Claim  ←  Attribution  ←  Explanation  ←  Result  ←  Source Events  ←  Measurement Definition  ←  Original Thesis</text><rect x="70" y="620" width="1260" height="36" rx="8" fill="#F1EBDD" stroke="#F1EBDD" stroke-width="0"/><text x="700" y="645" text-anchor="middle" fill="#345A68" font-family="DejaVu Sans" font-size="17" font-weight="600" style="">Cost to Produce Truth = the governed effort required to traverse this chain backward with complete, versioned evidence.</text><text x="60" y="662" fill="#345A68" font-family="DejaVu Sans" font-size="13" font-weight="600">© 2026 Martha Elizabeth Salter. All Rights Reserved. • Confidential &amp; Proprietary</text><text x="1340" y="662" text-anchor="end" fill="#345A68" font-family="DejaVu Sans" font-size="13" font-weight="700">SALT BASIN • GOVERNED REFERENCE</text></svg>