name: GTM Deliverable Agent — Benchmark Refresh Submit

on:
  schedule:
    # Monthly, 1st at 13:00 UTC (~8am ET). Benchmark research doesn't move
    # week to week the way trend news does -- adjust freely.
    - cron: "0 13 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/gtm-deliverable-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Submit benchmark refresh batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python benchmark_refresh.py

      - name: Commit pending batch record
        run: |
          git config user.name "gtm-deliverable-agent"
          git config user.email "actions@github.com"
          [ -f output/pending_batches.json ] && git add output/pending_batches.json
          git diff --staged --quiet || git commit -m "Record pending GTM benchmark-refresh batch"
          git push
