name: Promote approved deployment to production

on:
  workflow_dispatch:
    inputs:
      source_deployment_id:
        description: Salt Basin deployment record
        required: false
      promotion_gate_id:
        description: Eligible promotion gate
        required: false
      git_sha:
        description: Verified commit to promote
        required: false
      requested_by_user_id:
        description: Approving Salt Basin admin
        required: false

permissions:
  contents: read

concurrency:
  group: saltbasin-production-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # This workflow is meant to be dispatched with a verified commit to
      # promote — but something (likely a branch/ruleset "required workflow"
      # check) has been invoking it on every push to main without supplying
      # any inputs, since GitHub's own workflow_dispatch input validation
      # rejects that before a single job runs. That produced a silent,
      # unactionable "failure" on every push for over a month (2026-08-10
      # through at least 2026-09-22 — 31 straight failing runs, 0 jobs ever
      # executed, confirmed via the Actions API). Making the inputs optional
      # plus this explicit no-op guard means an unattended/input-less
      # invocation exits cleanly instead of failing — the actual promotion
      # logic below still requires a real git_sha to do anything.
      - name: Skip when not a real promotion request
        if: ${{ inputs.git_sha == '' }}
        run: |
          echo "No git_sha supplied — this wasn't a real promotion dispatch (likely an automatic required-check invocation). Skipping without failing."
          echo "If this workflow is configured as a required status check on main, it should be removed from that list — it's meant to be manually dispatched, not run on every push."

      - if: ${{ inputs.git_sha != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - if: ${{ inputs.git_sha != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: ${{ inputs.git_sha != '' }}
        run: npm ci
      - if: ${{ inputs.git_sha != '' }}
        run: npm run build
        env:
          VITE_TEST_BASE_URL: ${{ vars.VITE_TEST_BASE_URL }}
      - name: Trigger Render production deployment
        if: ${{ inputs.git_sha != '' && secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Trigger Netlify production deployment
        if: ${{ inputs.git_sha != '' && secrets.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "${{ secrets.NETLIFY_BUILD_HOOK_URL }}"
      - name: Record promotion evidence
        if: ${{ inputs.git_sha != '' }}
        run: |
          echo "deployment=${{ inputs.source_deployment_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "gate=${{ inputs.promotion_gate_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${{ inputs.git_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "approved_by=${{ inputs.requested_by_user_id }}" >> "$GITHUB_STEP_SUMMARY"

